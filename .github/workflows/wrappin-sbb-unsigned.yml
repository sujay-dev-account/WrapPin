name: WrapPin SBB unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [codex/sbb-train-mvp]

jobs:
  build:
    # Current Apple-silicon image with the requested Xcode toolchain. It avoids
    # the legacy Intel macOS 13 queue while still producing an arm64 iOS archive.
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build unsigned iOS archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project WrapPin.xcodeproj \
            -scheme "WrapPin SBB" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/WrapPinSBB.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Payload"
          app_path=$(find "$RUNNER_TEMP/WrapPinSBB.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app_path" || { echo "No app found in archive"; find "$RUNNER_TEMP/WrapPinSBB.xcarchive" -maxdepth 4 -print; exit 1; }
          cp -R "$app_path" "$RUNNER_TEMP/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/WrapPin-SBB-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WrapPin-SBB-unsigned
          path: ${{ runner.temp }}/WrapPin-SBB-unsigned.ipa
          if-no-files-found: error
