name: WrapPin SBB unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build unsigned iOS archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project WrapPin.xcodeproj \
            -scheme "WrapPin SBB" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/WrapPinSBB.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/WrapPinSBB.xcarchive/Products/Applications/WrapPinSBB.app" "$RUNNER_TEMP/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/WrapPin-SBB-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WrapPin-SBB-unsigned
          path: ${{ runner.temp }}/WrapPin-SBB-unsigned.ipa
          if-no-files-found: error
